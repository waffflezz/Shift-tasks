plugins {
    id 'java'
    id "io.freefair.lombok" version "8.13" apply false
    id "com.gradleup.shadow" version "9.4.1" apply false
}

group = 'ru.shift'
version = '1.0-SNAPSHOT'

subprojects {
    apply plugin: 'java'
    apply plugin: "io.freefair.lombok"
    apply plugin: "com.gradleup.shadow"

    group = 'ru.shift.task6'
    version = '1.0'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    dependencies {
        implementation 'org.slf4j:slf4j-api:2.0.13'
        implementation 'ch.qos.logback:logback-classic:1.5.18'
        implementation 'com.fasterxml.jackson.core:jackson-core:2.12.1'
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.0'
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.0'

        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core:3.24.1'

    }

    test {
        useJUnitPlatform()
    }
}

tasks.register("buildAll") {
    group = "custom-build"
    description = "Собирает fat-jar клиента и сервера"
    dependsOn(":client:shadowJar", ":server:shadowJar")
}